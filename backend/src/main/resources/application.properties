spring.application.name=hotel-booking-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:stayvibe-development-secret-key-change-this-to-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app.data-seeder.enabled=${DATA_SEEDER_ENABLED:true}
app.data-seeder.hotels-json-path=${HOTELS_JSON_PATH:frontend/.data/hotels.json}
